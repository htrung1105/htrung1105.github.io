lang: vi
label: Tiếng Việt
headline: AI Engineer
summary: >-
  Sinh viên năm cuối ngành Trí tuệ Nhân tạo, đam mê Information Retrieval System,
  Multimodal AI (NLP + CV), có kinh nghiệm xây dựng chatbot RAG/GraphRAG, hệ thống truy hồi
  đa phương thức và pipeline OCR tài liệu. Đồng tác giả bài báo Springer (SOICT 2025) về
  truy hồi sự kiện trong video. Mong muốn thực tập vị trí AI Engineer để xây dựng chatbot,
  RAG và xử lý tài liệu cho sản phẩm thực tế.
pdf: /files/resume.pdf
