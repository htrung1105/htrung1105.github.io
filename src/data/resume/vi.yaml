      - title: Trường THPT Chuyên Quang Trung
        subtitle: Lớp Toán-Tin
        date: 2020 – 2023
        meta: GPA 9.50 / 10 · Đội tuyển HSG Quốc gia môn Tin học.
  - heading: Đồ án
    kind: entries
    entries:
      - title: Vietnamese Legal GraphRAG
        subtitle: AI / Backend Engineer
        date: 04/2026 – 07/2026
        meta: Neo4j · Elasticsearch · LangGraph · FastAPI · github.com/ductai05/VietLegalGraphRAG
        bullets:
          - 'Chatbot: agent ReAct (LangGraph) tự gọi công cụ truy hồi, kiểm tra hiệu lực văn bản qua đồ thị và tìm link nguồn; chạy trên Open WebUI, trả lời kèm trích dẫn, từ chối khi thiếu căn cứ, phản hồi dưới 5 giây.'
          - 'Pipeline dữ liệu: phụ trách tầng đồ thị tri thức, đưa 353K+ văn bản pháp luật vào Neo4j (7M+ node, 20M+ cạnh) với các quan hệ sửa đổi, bãi bỏ, hướng dẫn, dẫn chiếu.'
          - 'Retrieval & evaluation: BM25 + dense kNN (vnlegal-lal) trên Elasticsearch, hợp nhất RRF và rerank bằng cross-encoder bge-reranker-v2-m3, tăng NDCG@10 thêm 12% và Recall@10 thêm 20%.'
          - 'Xử lý tài liệu: tích hợp OCR Google Cloud Vision cho file scan và ảnh hợp đồng, để LLM đánh dấu điều khoản rủi ro.'
          - 'API & vận hành: xây dựng API FastAPI, viết API contract cho frontend; thiết lập CI/CD với Docker và GitHub Actions.'
      - title: TradingClaw
        subtitle: AI / Backend Engineer
        date: 04/2026 – 07/2026
        meta: FastAPI · PostgreSQL · Gemini API · github.com/ductai05/TradingClaw
        bullets:
          - 'Xây dựng backend FastAPI: xác thực, lệnh sandbox Binance Testnet, gateway tới các dịch vụ ML (FinBERT, Kronos, Isolation Forest).'
          - 'Tích hợp LLM & monitoring: tích hợp Gemini API cho tính năng AI tutor; viết middleware theo dõi token và chi phí của từng request LLM.'
      - title: Sino-Nom Historical OCR
        subtitle: ML Engineer
        date: 11/2025 – 12/2025
        meta: PaddlePaddle · PP-OCRv5 · github.com/ductai05/NLP-ChineseOCR
        bullets:
          - 'Fine-tune và đánh giá mô hình phát hiện chữ PP-OCRv5 (thuật toán DB) trên 3,411 trang Hán Nôm: tăng H-mean 30.2% (0.731 → 0.952), precision 0.966, recall 0.937 trên tập test NomNaOCR.'
  - heading: Nghiên cứu & Công bố
    kind: entries
    entries:
      - title: 'KPTER: K-Pointer for Temporal Event Retrieval'
        subtitle: Đồng tác giả, Team WATLERE
        date: 07/2024 – 11/2025
        meta: >-
          Duc Anh Khoa Dinh, Duc-Tai Dinh, Le Hoang Trung Nguyen, Thanh Nhan Nguyen (đóng góp
          ngang nhau). SOICT 2025, Springer CCIS vol. 2913, pp. 304–318.
          doi:10.1007/978-981-92-2587-3_24
        bullets:
          - Giải Best Presentation, SOICT 2025; Top 12 / 80+ đội tại AI Challenge HCMC 2025, vòng sơ loại đạt 82/88.
          - 'Hệ thống truy hồi video đa phương thức cho KIS, VQA và TRAKE: pipeline trích xuất CLIP + BEiT-3, OCR (PaddleOCR, VietOCR, Qwen-2.5-VL), ASR (Whisper) và object detection (YOLO-World), rồi đánh chỉ mục vector vào Milvus và văn bản OCR/ASR vào Elasticsearch để truy vấn.'
          - 'Xếp hạng: hợp nhất kết quả đa nguồn bằng WRRF; thuật toán K-Pointer tìm chuỗi sự kiện đúng thứ tự thời gian với độ phức tạp O(KN), thay cho K vòng lặp lồng nhau.'
