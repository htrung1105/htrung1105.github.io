lang: vi
label: Tiếng Việt
headline: Kỹ sư AI · Nghiên cứu viên AI
summary: >-
  Sinh viên năm cuối ngành Trí tuệ Nhân tạo, Trường ĐH Khoa học Tự nhiên – ĐHQG-HCM;
  đồng tác giả bài báo Springer (SOICT 2025) về truy hồi video đa phương thức. Xây dựng
  trọn vẹn hệ thống RAG/GraphRAG, LLM agent và OCR, từ thiết kế truy hồi, fine-tune mô
  hình đến triển khai dịch vụ FastAPI. Giải Nhì ICPC miền Nam 2024; tiếng Anh B2 (VSTEP).
  Mong muốn thực tập vị trí AI Engineer hoặc AI Research.
pdf: /files/resume.pdf
