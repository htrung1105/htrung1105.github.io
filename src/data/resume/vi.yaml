      - title: Trường THPT Chuyên Quang Trung, Bình Phước
        subtitle: Chuyên Tin
        date: 2020 – 2023
        meta: Điểm TB 9.5 / 10 · Học bổng Vallet 2023 · Đội tuyển HSG Quốc gia môn Tin học.
  - heading: Nghiên cứu & Công bố
    kind: entries
    entries:
      - title: 'KPTER: K-Pointer for Temporal Event Retrieval'
        subtitle: Kỹ sư hệ thống, Team WATLERE
        date: 07/2024 – 11/2025
        meta: >-
          D. A. K. Dinh, D.-T. Dinh, L. H. T. Nguyen, T. N. Nguyen. In: Information and
          Communication Technology (SOICT 2025), CCIS vol. 2913, pp. 304–318, Springer, 2027.
          doi:10.1007/978-981-92-2587-3_24
        bullets:
          - Giải Best Presentation, SOICT 2025; xếp Top 12 / 80+ đội tại AI Challenge HCMC 2025.
          - Xây dựng pipeline đánh chỉ mục đa phương thức trên 300 giờ video, kết hợp OCR, ASR, embedding và object detection.
          - Xây dựng backend và API tìm kiếm cho thuật toán K-Pointer + WRRF của nhóm (+10% Recall@1).
  - heading: Dự án
    kind: entries
    entries:
      - title: Vietnamese Legal GraphRAG
        subtitle: Kỹ sư AI (dự án nhóm)
        date: 04/2026 – 07/2026
        meta: Neo4j · LangGraph · BM25 + dense retrieval · FastAPI · github.com/ductai05/VietLegalGraphRAG
        bullets:
          - 'Phụ trách tầng đồ thị tri thức: đánh chỉ mục 353K+ văn bản pháp luật thành đồ thị Neo4j 7M+ node, 20M+ cạnh cho hỏi-đáp multi-hop.'
          - Tăng NDCG@10 thêm 12% và Recall@10 thêm 20% nhờ kết hợp BM25 + dense (vnlegal-lal) qua RRF và cross-encoder reranker.
          - Xây dựng dịch vụ hỏi-đáp agentic RAG (FastAPI) theo vai trò người dùng, kèm trích dẫn pháp lý, phản hồi dưới 5 giây.
      - title: TradingClaw
        subtitle: Kỹ sư AI / Backend (dự án nhóm)
        date: 04/2026 – 07/2026
        meta: FastAPI · Supabase PostgreSQL · Gemini · Binance Testnet · github.com/ductai05/TradingClaw
        bullets:
          - 'Xây dựng backend FastAPI: xác thực, lệnh sandbox Binance Testnet, gateway tới các dịch vụ ML (FinBERT, Kronos, Isolation Forest) và lịch sử kết quả ML.'
          - Tích hợp Gemini cho AI tutor; viết middleware ghi log token và chi phí của từng request LLM.
      - title: Sino-Nom Historical OCR
        subtitle: ML Engineer (dự án nhóm)
        date: 11/2025 – 12/2025
        meta: PaddlePaddle · PP-OCRv5 · 2× NVIDIA T4 · github.com/ductai05/NLP-ChineseOCR
        bullets:
          - Fine-tune mô hình phát hiện chữ PP-OCRv5 (backbone PP-HGNetV2-B4, DB head) trên 3.4K+ ảnh, huấn luyện phân tán 2× T4.
          - Tăng H-mean 30.2% (0.731 → 0.952) với precision 0.966 trên tập test NomNaOCR; phụ trách đánh giá và phân tích lỗi.
