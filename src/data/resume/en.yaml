        date: Jul 2024 – Nov 2025
        meta: Co-author · AI Researcher & Retrieval Engineer (Team WATLERE) — AI Challenge HCMC 2025 & SOICT 2025
        bullets:
          - Best Presentation Award at SOICT 2025; ranked Top 12 / 80+ at AI Challenge HCMC 2025.
