      - title: Vietnamese Legal GraphRAG
        subtitle: AI / Backend Engineer
        date: Apr 2026 – Jul 2026
        meta: Neo4j · Elasticsearch · LangGraph · FastAPI · github.com/ductai05/VietLegalGraphRAG
        bullets:
          - "Chatbot: ReAct agent (LangGraph) that calls retrieval tools, checks a law's legal effect through the graph and finds source links; served on Open WebUI with citations, refusal when evidence is missing, and answers in under 5 s."
          - 'Data pipeline: owned the knowledge-graph layer, loading 353K+ legal documents into Neo4j (7M+ nodes, 20M+ edges) with amendment, repeal, guidance and citation relations.'
          - 'Retrieval & evaluation: BM25 + dense kNN (vnlegal-lal) on Elasticsearch, fused by RRF and reranked with bge-reranker-v2-m3, raising NDCG@10 by 12% and Recall@10 by 20%.'
          - 'Document processing: integrated Google Cloud Vision OCR for scanned contracts so the LLM can flag risky clauses.'
          - 'API & ops: built the FastAPI service and its API contract for the frontend; set up CI/CD with Docker and GitHub Actions.'
